name: Build HAP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-hap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache DevEco Command Line Tools 26.0.0.621 (Beta2)
        id: cache-clt
        uses: actions/cache@v4
        with:
          path: /tmp/commandline-tools-621.zip
          key: devecocl-26.0.0.621-beta2

      - name: Download Command Line Tools 26.0.0.621 (Beta2)
        if: steps.cache-clt.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o /tmp/commandline-tools-621.zip \
            "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/95/v3/ksUKbWstTiqarw0qRRlIXQ/commandline-tools-linux-x64-26.0.0.621.zip?HW-CC-KV=V1&HW-CC-Date=20260807T073632Z&HW-CC-Expire=315360000&HW-CC-Sign=A35EAF190071EF4A275BEA934F065B12D557E955718F037D1689D078E30B83DF"
          ls -lh /tmp/commandline-tools-621.zip

      - name: Unpack Command Line Tools
        run: |
          cd "${{ github.workspace }}"
          unzip -q /tmp/commandline-tools-621.zip
          ls command-line-tools

      - name: Set up build environment
        run: |
          echo "${{ github.workspace }}/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/command-line-tools/tool/node/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=${{ github.workspace }}/command-line-tools/sdk" >> "$GITHUB_ENV"
          echo "NODE_HOME=${{ github.workspace }}/command-line-tools/tool/node" >> "$GITHUB_ENV"
          java -version
          node -v
          ohpm -v
          hvigorw --version

      - name: Install dependencies
        working-directory: apps/harmonyos
        run: ohpm install

      - name: Build HAP (release)
        working-directory: apps/harmonyos
        run: hvigorw --mode module -p product=default -p buildMode=release clean assembleHap

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2a-explore-hap
          path: apps/harmonyos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error
